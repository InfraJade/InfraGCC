# Prod-style mutual-TLS termination in front of the ingest API (DECISIONS.md D8).
#
# A complete nginx.conf (it loads the njs module), mounted at /etc/nginx/nginx.conf in nginx:1.27-alpine.
# Used locally by infra/compose.mtls.yaml; the same logic applies to a Kubernetes ingress controller.
#
#   collector ──TLS 1.2+/client cert──► nginx :8443 ──HTTP──► ingest-api:8001
#
# Files (dev: generated by infra/pki/make-ca.sh into infra/pki/out/, mounted at /etc/nginx/pki):
#   ingest-server.crt / ingest-server.key   server certificate (SAN ingest-mtls, localhost)
#   ca.crt                                  CA that signs collector client certificates
#
# Identity headers sent upstream (any client-supplied header of the same name is replaced, never passed on):
#   X-Client-Cert-Fingerprint   SHA-256 of the client certificate (DER), lowercase hex, no colons, computed in
#                               njs (cert_fingerprint.js). nginx's own $ssl_client_fingerprint is SHA-1; if
#                               njs is unavailable, send that instead and store SHA-1 fingerprints.
#   X-Client-Cert-Subject       $ssl_client_s_dn (RFC 2253), for logs and audit only
# The ingest API trusts these headers only when the TCP peer is in INGEST_TRUSTED_PROXIES (this proxy).

load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;

    js_import fp from /etc/nginx/njs/cert_fingerprint.js;
    js_set $client_cert_sha256 fp.sha256;

    log_format mtls '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time '
                    'cert="$ssl_client_s_dn" verify=$ssl_client_verify sha256=$client_cert_sha256';
    access_log /dev/stdout mtls;

    # Headers with underscores are dropped (default), so `X_Client_Cert_Fingerprint` cannot sneak through.
    underscores_in_headers off;
    ignore_invalid_headers on;

    sendfile on;
    keepalive_timeout 65s;

    upstream ingest_api {
        server ingest-api:8001;
        keepalive 16;
    }

    # Container-local liveness for the compose healthcheck (no client certificate needed).
    server {
        listen 127.0.0.1:8080;
        access_log off;
        location = /nginx-health {
            return 200 "ok\n";
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate         /etc/nginx/pki/ingest-server.crt;
        ssl_certificate_key     /etc/nginx/pki/ingest-server.key;
        ssl_client_certificate  /etc/nginx/pki/ca.crt;
        ssl_verify_client       on;
        ssl_verify_depth        2;
        # Revocation (production): ssl_crl /etc/nginx/pki/collectors.crl;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # Batches are gzip-compressed; 20 MiB matches INGEST_MAX_BODY_BYTES (after decompression).
        client_max_body_size 20m;
        client_body_buffer_size 1m;

        # Only the collector API is exposed through this listener.
        location /ingest/v1/ {
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            proxy_pass http://ingest_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append): the client's own X-Forwarded-* values are never trusted.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            # Redefining these replaces any client-supplied header with the same name.
            proxy_set_header X-Client-Cert-Fingerprint $client_cert_sha256;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        }

        location = /healthz {
            proxy_pass http://ingest_api;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Cert-Fingerprint "";
            proxy_set_header X-Client-Cert-Subject "";
        }

        location / {
            return 404;
        }
    }
}
