# Jade GCC login theme: the same look as the web app's sign-in page (live network backdrop, rack scene with the
# logo's heartbeat, brand logo). Extends Keycloak's `base` templates (no PatternFly); every class hook below maps
# to rules in css/gcc.css. Enabled per realm with "loginTheme": "gcc" (infra/keycloak/gcc-realm.json).
parent=base

styles=css/gcc.css
scripts=js/gcc-login.js

meta=viewport==width=device-width,initial-scale=1 color-scheme==dark,light

kcHtmlClass=gcc
kcBodyClass=gcc-body
kcLoginClass=gcc-page

kcHeaderClass=gcc-hidden
kcFormCardClass=gcc-card
kcFormHeaderClass=gcc-card-header
kcContentWrapperClass=gcc-row

## Locale
kcLocaleMainClass=gcc-locale
kcLocaleListClass=gcc-locale-menu
kcLocaleItemClass=gcc-locale-item

## Alerts and feedback
kcAlertClass=gcc-alert
kcAlertTitleClass=gcc-alert-text
kcFeedbackErrorIcon=gcc-ico gcc-ico-error
kcFeedbackWarningIcon=gcc-ico gcc-ico-warning
kcFeedbackSuccessIcon=gcc-ico gcc-ico-success
kcFeedbackInfoIcon=gcc-ico gcc-ico-info
kcResetFlowIcon=gcc-ico gcc-ico-restart

## Forms
kcFormClass=gcc-form
kcFormGroupClass=gcc-field
kcFormGroupErrorClass=gcc-field-invalid
kcLabelClass=gcc-label
kcLabelWrapperClass=gcc-label-wrap
kcInputClass=gcc-input
kcInputWrapperClass=gcc-input-wrap
kcInputGroup=gcc-input-group
kcInputErrorMessageClass=gcc-field-error
kcInputHelperTextBeforeClass=gcc-help
kcInputHelperTextAfterClass=gcc-help
kcInputClassCheckbox=gcc-check
kcInputClassCheckboxInput=gcc-check-input
kcInputClassCheckboxLabel=gcc-check-label
kcInputClassRadio=gcc-check
kcInputClassRadioInput=gcc-check-input
kcInputClassRadioLabel=gcc-check-label
kcFormOptionsClass=gcc-options
kcFormOptionsWrapperClass=gcc-options-links
kcFormSettingClass=gcc-settings
kcFormButtonsClass=gcc-buttons
kcFormButtonsWrapperClass=gcc-buttons
kcFormPasswordVisibilityButtonClass=gcc-eye-btn
kcFormPasswordVisibilityIconShow=gcc-ico gcc-ico-eye
kcFormPasswordVisibilityIconHide=gcc-ico gcc-ico-eye-off
kcSignUpClass=gcc-info
kcInfoAreaWrapperClass=gcc-info-inner

## Buttons
kcButtonClass=gcc-btn
kcButtonPrimaryClass=gcc-btn-primary
kcButtonDefaultClass=gcc-btn-secondary
kcButtonBlockClass=gcc-btn-block
kcButtonLargeClass=gcc-btn-lg

## Social / identity providers
kcFormSocialAccountSectionClass=gcc-social
kcFormSocialAccountListClass=gcc-social-list
kcFormSocialAccountListButtonClass=gcc-btn gcc-btn-secondary gcc-btn-block
kcFormSocialAccountNameClass=gcc-social-name

## Other flows
kcSelectAuthListClass=gcc-select-list
kcSelectAuthListItemClass=gcc-select-item
kcSelectAuthListItemIconClass=gcc-hidden
kcSelectAuthListItemHeadingClass=gcc-select-heading
kcSelectAuthListItemDescriptionClass=gcc-select-desc
kcRecoveryCodesList=gcc-codes
