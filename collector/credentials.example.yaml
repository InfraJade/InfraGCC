# BMC credentials for the `file` provider (GCC_CREDENTIALS_PROVIDER=file,
# GCC_CREDENTIALS_FILE=/etc/gcc-collector/credentials.yaml). Mount the real file read-only, mode 0400,
# owned by the collector user. Passwords never leave the collector; the cloud only knows `credential_ref`.
#
# Lookup order for a server: hosts[<bmc_host> exactly as configured] -> refs[<credential_ref>] -> default.
# Use a read-only (ReadOnly role) BMC account. The file is re-read when it changes.

default:
  username: gcc-monitor
  password: change-me

refs:
  # credential_ref set on a server by an admin in the app (e.g. a lab with its own account)
  hyd1-lab:
    username: gcc-monitor-lab
    password: change-me-too

hosts:
  # one-off overrides by bmc_host
  "10.20.1.99":
    username: root
    password: change-me-as-well
