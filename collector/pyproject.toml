[project]
name = "gcc-collector"
version = "1.0.0"
description = "Jade GCC on-prem collector: polls BMCs over Redfish and pushes batches to the cloud ingest API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.3",
    "prometheus-client>=0.21.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
gcc-collector = "gcc_collector.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcc_collector"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PTH", "C4", "PIE", "RET"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # non-crypto random is fine for jitter
    "RUF012", # Pydantic class attrs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a live Redfish service (GCC_IT_REDFISH_URL)",
]
