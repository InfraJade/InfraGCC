# Jade GCC web — nginx server config.
# Installed as /etc/nginx/templates/default.conf.template; the nginx image renders it with envsubst at start.
# Only ${GCC_*} and ${NGINX_LOCAL_RESOLVERS} are substituted (NGINX_ENVSUBST_FILTER); nginx's own $variables
# are left alone. GCC_* values come from docker/05-gcc-config.envsh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One Cache-Control per URI class (set once at server level so add_header inheritance stays simple).
map $uri $gcc_cache_control {
    default                 "";
    ~^/assets/              "public, max-age=31536000, immutable";
    /index.html             "no-cache";
    /config.js              "no-store";
    /favicon.png            "public, max-age=86400";
    /apple-touch-icon.png   "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 10m;

    # Resolve the API upstream at request time (container DNS), so nginx starts even if app-api is not up yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/problem+json image/svg+xml application/manifest+json;

    # Security headers (also on proxied API responses and errors).
    add_header Cache-Control $gcc_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), fullscreen=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # frame-src: embedded Superset dashboards + the IdP (silent-renew iframe fallback).
    # connect-src: same-origin API and WebSocket ('self'), the IdP (token/discovery endpoints), API_BASE if set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${GCC_OIDC_ORIGIN} ${GCC_API_CONNECT}; frame-src ${GCC_SUPERSET_ORIGIN} ${GCC_OIDC_ORIGIN}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' ${GCC_OIDC_ORIGIN}; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live updates WebSocket (/api/v1/live): upgrade + long timeouts (server pings every 25 s).
    location /api/v1/live {
        set $gcc_api_upstream ${GCC_API_UPSTREAM};
        proxy_pass $gcc_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # App API (REST), same origin for the browser: no CORS needed.
    location /api/ {
        set $gcc_api_upstream ${GCC_API_UPSTREAM};
        proxy_pass $gcc_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build output: long-lived cache; a missing asset is a real 404, not the SPA.
    location /assets/ {
        try_files $uri =404;
    }

    location = /config.js {
        try_files $uri =404;
    }

    # SPA fallback: every other path renders index.html (client-side routing).
    location / {
        try_files $uri /index.html;
    }
}
