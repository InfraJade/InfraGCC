[project]
name = "gcc-backend"
version = "1.0.0"
description = "Jade GCC data center monitoring platform: ingest API, app API, alert worker and scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
    "cryptography>=44.0.0",
    "email-validator>=2.2.0",
    "prometheus-client>=0.21.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "celery-types>=0.22.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PTH", "C4", "PIE", "RET"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # non-crypto random is fine for jitter/simulation
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # SQLAlchemy/Pydantic class attrs
]

[tool.ruff.lint.per-file-ignores]
# Fixed identifiers interpolated into SQL (view names, table lists) are not injection vectors.
"tests/**" = ["S105", "S106", "S108", "S608", "E501"]
"alembic/versions/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app", "tests", "alembic", "scripts"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs a TimescaleDB instance (TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]
